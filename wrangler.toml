# Cloudflare Pages project for app.hannapetwellnesscenter.com
name = "hanna-clinic-app"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "hanna-clinic"
# Replace with the id Cloudflare shows after `npx wrangler d1 create hanna-clinic` (README, step 2).
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
